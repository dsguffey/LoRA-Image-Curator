[project]
name = "lora-image-curator"
version = "0.27.21"
description = "Local-first desktop curation and export for LoRA image datasets"
readme = "README.md"
requires-python = ">=3.11"
license = { file = "LICENSE" }
authors = [
    { name = "David Scott Guffey" },
]
keywords = ["lora", "dataset", "image-curation", "sqlite", "tkinter"]
classifiers = [
    "Development Status :: 4 - Beta",
    "License :: OSI Approved :: MIT License",
    "Operating System :: Microsoft :: Windows :: Windows 11",
    "Programming Language :: Python :: 3",
    "Topic :: Multimedia :: Graphics",
]
dependencies = [
    "numpy>=1.26,<3",
    "Pillow>=10,<13",
    "transformers==4.56.2",
    "einops>=0.7,<1",
    "timm>=0.9,<2",
    "Send2Trash>=1.8,<3",
]

[project.optional-dependencies]
body = [
    "mediapipe>=0.10,<1",
]

[project.urls]
Author = "https://www.linkedin.com/in/davidsguffey/"

[tool.ruff]
target-version = "py311"
line-length = 88
exclude = ["tests/test_*.py"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
