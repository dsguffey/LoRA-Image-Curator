name: Repository checks

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  dependency-free-checks:
    name: Python ${{ matrix.python-version }} on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - windows-latest
        python-version:
          - "3.11"
          - "3.14"

    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          
      - name: Install regression test dependencies
        run: python -m pip install "numpy>=1.26,<3" "Pillow>=10,<13"

      - name: Compile manifested Python source
        run: python -m tools.compile_project

      - name: Run bounded repository audit
        run: python tools/audit_project.py

      - name: Verify current repository contracts
        run: python -X dev -m tests.test_v0284_regression

      - name: Verify trigger keyword export contracts
        run: python -X dev -m tests.test_trigger_export_regression

      - name: Verify export source resolution
        run: python -X dev -m tests.test_export_source_resolution

      - name: Verify Florence caption search
        run: python -X dev -m tests.test_florence_caption_search

      - name: Verify Caption Tagging Mode
        run: python -X dev -m tests.test_caption_tagging_mode

      - name: Verify Browser Polish contracts
        run: python -X dev -m tests.test_browser_polish
